<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>點貨清單</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="點貨清單"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1d1d1b">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
[hidden]{display:none!important}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#f4f4f2;color:#1d1d1b}
header{position:sticky;top:0;background:#1d1d1b;color:#fff;padding:10px 12px;z-index:5}
h1{font-size:16px;margin:0 0 4px}.sub{font-size:12px;opacity:.75}
.bar{height:6px;background:#444;border-radius:3px;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:#4caf50;width:0}
.stat{display:flex;justify-content:space-between;font-size:13px}
.tools{display:flex;gap:6px;margin-top:8px}.tools button{flex:1;padding:9px 4px;border:0;border-radius:8px;background:#333;color:#fff;font-size:13px}.tools button.on{background:#4caf50}.tools button.warnb{background:#e53935}
.grp{font-size:12px;color:#666;padding:12px 12px 4px;font-weight:600}
.row{background:#fff;margin:6px 8px;border-radius:12px;padding:10px 10px 10px 12px;border:3px solid transparent}
.row.part{border-color:#f5a623;background:#fff8e6}.row.done{background:#e8f5e9;border-color:#4caf50}.row.over{border-color:#e53935;background:#ffebee}
.top{display:flex;align-items:baseline;gap:8px}.no{font-size:12px;color:#999}.nm{font-size:17px;font-weight:700;flex:1}.cd{font-size:12px;color:#888;margin:2px 0 8px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:64px;height:56px;border-radius:12px;border:0;font-size:30px;font-weight:700;background:#e0e0e0;color:#1d1d1b;flex:none}
.ctl button.plus{background:#1d1d1b;color:#fff}.ctl button.full{width:auto;flex:none;padding:0 12px;font-size:15px;background:#4caf50;color:#fff}
.cnt{flex:1;text-align:center;height:56px;border-radius:12px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;background:#fff}
.cnt small{font-size:16px;color:#888;font-weight:400;margin-left:3px}
.over .cnt{color:#e53935;border-color:#e53935}.done .cnt{color:#2e7d32;border-color:#4caf50}
.msg{font-size:13px;color:#e53935;margin-top:6px;font-weight:600}.done .ctl button.full{display:none}
.hide .row.done{display:none}.hide .grp{display:none}
footer{padding:16px 12px 40px;font-size:12px;color:#888}
#inp{padding:16px}#inp h2{margin:0 0 6px}.hint{font-size:13px;color:#666}textarea{width:100%;height:45vh;font-size:16px;border-radius:8px;border:1px solid #ccc;padding:8px}#inp .tools button{background:#555;padding:12px;font-size:15px}#inp .tools button.on{background:#4caf50}.warn{color:#e53935}
#rep{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
#rep .card{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:480px}
#rep h3{margin:0 0 4px;font-size:18px}#rep .meta{font-size:12px;color:#666;margin-bottom:10px}
#rep table{width:100%;border-collapse:collapse;font-size:14px}#rep td,#rep th{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}#rep td.n{text-align:right;white-space:nowrap}
#rep .ok{color:#2e7d32;font-weight:700;padding:16px 0;font-size:16px}#rep .tot{margin-top:10px;font-size:14px;font-weight:700}
#rep .btns{display:flex;gap:8px;margin-top:14px}#rep .btns button{flex:1;padding:12px;border:0;border-radius:10px;font-size:15px;background:#1d1d1b;color:#fff}#rep .btns button.g{background:#e0e0e0;color:#1d1d1b}
.r{color:#e53935}.o{color:#b26a00}
</style></head><body>
<section id="inp" hidden><h2>貼上出貨單</h2><p class="hint">從電子檔把品項整段複製貼上。每行要有產品編號（例 XTF-001）、品名、件數、個數/件、數量；表頭的客戶名稱、訂單編號會自動抓。</p><textarea id="ta" placeholder="貼在這裡…"></textarea><div id="pv" class="hint"></div><div class="tools"><button id="ex">載入範例</button><button id="back">取消</button><button id="go" class="on">開始點貨</button></div></section>
<div id="app" hidden><header><h1 id="h1"></h1><div class="sub" id="sub"></div>
<div class="bar"><i id="pg"></i></div>
<div class="stat"><span id="s1"></span><span id="s2"></span></div>
<div class="tools"><button id="tg">隱藏已齊</button><button id="sortb">依系列排</button><button id="sum" class="warnb">缺貨總表</button></div>
<div class="tools"><button id="rs">全部歸零</button><button id="nw" class="on">換新單</button></div></header>
<main id="list"></main>
<footer>＋／－ 一次加減一件；點中間的數字可以直接輸入件數；「全到」一鍵補滿。綠框＝已齊、橘框＝搬一部分、紅框＝超過單上件數。進度存在這支手機的瀏覽器裡。</footer></div>
<div id="rep" hidden><div class="card" id="repc"></div></div>
<script>
const SAMPLE="客戶名稱：範例客戶\n訂單編號：S-範例-001\n出貨日期：2026/01/01\n01\tXTA-001\t2尺長花槽\t24\t24\t576\n02\tXTA-004\t尺半中花槽底盤\t5\t24\t120\n03\tXTB-012\t仿陶高盆尺2\t4\t12\t48\n04\tXTB-004\t仿陶底盤尺4\t3\t48\t144\n05\tXTD-001\t彩陶缽3吋\t2\t240\t480\n06\tXTD-002\t彩陶缽4.5吋\t7\t60\t420\n07\tXTD-003\t彩陶盆3.5吋\t4\t120\t480\n08\tXTD-004\t彩陶盆5吋\t3\t60\t180\n09\tXTD-005\t彩陶盆6吋\t4\t60\t240\n10\tXTD-006\t彩陶皿3.5吋\t6\t480\t2880\n11\tXTD-007\t彩陶皿5吋\t7\t240\t1680\n12\tXTG-002\t家庭菜圃\t51\t6\t306\n13\tXTG-001\t育苗盤\t5\t48\t240\n14\tXSE-001\t玫瑰浮雕歐洲盆9寸\t3\t20\t60\n15\tXSE-004\t玫瑰浮雕歐洲盆尺5\t30\t10\t300\n16\tXSE-005\t玫瑰浮雕歐洲盆尺7\t10\t10\t100\n17\tXTF-001\t如意盆4.5吋\t10\t60\t600\n18\tXTF-006\t如意盆12.5吋\t32\t10\t320\n19\tXTF-013\t如意高盆4.5吋\t10\t60\t600\n20\tXTF-017\t如意高盆10.5吋\t32\t10\t320\n21\tXTF-018\t如意高盆12.5吋\t12\t8\t96\n22\tXTF-008\t如意底盤5.5吋\t7\t144\t1008\n23\tXTF-009\t如意底盤6.5吋\t14\t72\t1008\n24\tXTF-010\t如意底盤8.5吋\t19\t72\t1368\n25\tXTF-011\t如意底盤10.5吋\t31\t36\t1116\n26\tXTF-012\t如意底盤12.5吋\t5\t24\t120\n27\tXSD-008\t彩陶花槽（小）\t5\t40\t200\n28\tXSD-009\t彩陶花槽底盤（中）\t15\t30\t450\n29\tXSD-010\t彩陶花槽底盤（小）\t9\t40\t360\n30\tXTC-001\t3D素陶底盤\t6\t720\t4320\n31\tXTC-003\t5D素陶底盤\t3\t120\t360\n32\tXTC-004\t6D素陶底盤\t3\t120\t360\n33\tXTC-005\t7D素陶底盤\t3\t120\t360\n34\tXTC-006\t8D素陶底盤\t3\t120\t360\n35\tXTC-012\t7S素陶盆\t4\t60\t240\n36\tXTC-017\t4H素陶盆\t4\t60\t240\n37\tXTC-020\t7H素陶盆\t3\t60\t180";
function parse(txt){const o={cust:'',ord:'',date:'',items:[]};let m;
 if(m=txt.match(/客戶名稱[：:]\s*(\S+)/))o.cust=m[1];if(m=txt.match(/訂單編號[：:]\s*(\S+)/))o.ord=m[1];if(m=txt.match(/出貨日期[：:]\s*(\d{4}\s*\/\s*\d{1,2}\s*\/\s*\d{1,2})/))o.date=m[1].replace(/\s/g,'');
 txt.split(/\n/).forEach(l=>{const c=l.match(/[A-Z]{2,4}-\d{2,4}/);if(!c)return;let rest=l.slice(c.index+c[0].length);
  const nums=[...rest.matchAll(/\d[\d,]*(?:\.\d+)?/g)];const tail=[];let cut=rest.length;
  for(let i=nums.length-1;i>=0&&tail.length<3;i--){const before=rest.slice(nums[i].index+nums[i][0].length,cut);if(/[^\s\t|,]/.test(before))break;tail.unshift(nums[i]);cut=nums[i].index}
  if(tail.length<2)return;const v=tail.map(x=>parseFloat(x[0].replace(/,/g,'')));const name=rest.slice(0,cut).trim();
  const box=v[0],per=v[1],qty=v.length>2?v[2]:box*per;o.items.push({no:o.items.length+1,code:c[0],name,box,per,qty,chk:box*per===qty})});
 return o}
let O=null,K='',D=[],st={},bySeries=false;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
const series=c=>c.split('-')[0];
const got=d=>{const v=st[d.no];if(v===true)return d.box;if(v&&typeof v==='object')return v.bad||0;return typeof v==='number'?v:0};
const cls=d=>{const g=got(d);return g>d.box?'over':g===d.box?'done':g>0?'part':''};
function load(o){O=o;D=o.items;K='ck-'+(o.ord||'noord');$('h1').textContent=(o.cust||'未填客戶')+'｜點貨';
 $('sub').textContent=[o.ord,o.date&&('出貨 '+o.date)].filter(Boolean).join(' · ');
 st={};try{st=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
 D.forEach(d=>{st[d.no]=got(d)});
 $('inp').hidden=true;$('app').hidden=false;render()}
function setN(d,n){st[d.no]=Math.max(0,n);save();upd(d)}
function rowHTML(d){const g=got(d),c=cls(d);return `<div class="top"><span class="no">${d.no}</span><span class="nm">${d.name}</span></div>
 <div class="cd">${d.code} · ${d.per}個/件 · 共${d.qty.toLocaleString()}個${d.chk===false?' · <span class="r">⚠ 件×個≠數量</span>':''}</div>
 <div class="ctl"><button data-a="-">−</button><div class="cnt" data-a="in">${g}<small>/ ${d.box} 件</small></div><button class="plus" data-a="+">＋</button><button class="full" data-a="f">全到</button></div>
 ${c==='over'?`<div class="msg">⚠ 超過 ${g-d.box} 件，請核對</div>`:''}`}
function upd(d){const r=document.querySelector(`.row[data-no="${d.no}"]`);if(r){r.className='row '+cls(d);r.innerHTML=rowHTML(d)}stats()}
function render(){const L=$('list');L.innerHTML='';
 let arr=[...D];if(bySeries)arr.sort((a,b)=>series(a.code).localeCompare(series(b.code))||a.code.localeCompare(b.code));
 let last='';arr.forEach(d=>{if(bySeries&&series(d.code)!==last){last=series(d.code);const g=document.createElement('div');g.className='grp';g.textContent=last;L.appendChild(g)}
  const r=document.createElement('div');r.className='row '+cls(d);r.dataset.no=d.no;r.innerHTML=rowHTML(d);L.appendChild(r)});stats()}
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const no=+b.closest('.row').dataset.no;const d=D.find(x=>x.no===no);const g=got(d);
 const a=b.dataset.a;if(a==='+')setN(d,g+1);else if(a==='-')setN(d,g-1);else if(a==='f')setN(d,d.box);
 else if(a==='in'){const v=prompt(`${d.name}\n單上 ${d.box} 件，目前搬了幾件？`,g||'');if(v===null)return;const n=parseInt(v);if(!isNaN(n))setN(d,n)}});
function stats(){const tb=D.reduce((a,d)=>a+d.box,0);let done=0,gb=0,over=0;D.forEach(d=>{const g=got(d);gb+=Math.min(g,d.box);if(g===d.box)done++;if(g>d.box)over++});
 $('pg').style.width=(gb/tb*100)+'%';$('s1').textContent=`已齊 ${done}/${D.length} 項`;$('s2').textContent=`件數 ${D.reduce((a,d)=>a+got(d),0)}/${tb}`+(over?`｜超過 ${over} 項`:'')}
function report(){const short=D.filter(d=>got(d)<d.box),over=D.filter(d=>got(d)>d.box);
 const now=new Date();const ts=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
 let h=`<h3>${O.cust||''} 點貨結果</h3><div class="meta">${O.ord||''} · 統計時間 ${ts}</div>`;
 if(!short.length&&!over.length)h+=`<div class="ok">✓ 全部 ${D.length} 項、${D.reduce((a,d)=>a+d.box,0)} 件都已點齊</div>`;
 if(short.length){h+=`<table><tr><th>缺件（${short.length} 項）</th><th class="n">已搬/單上</th><th class="n">差</th></tr>`+short.map(d=>`<tr><td>${d.name}<br><small style="color:#888">${d.code}</small></td><td class="n">${got(d)}/${d.box}</td><td class="n r">−${d.box-got(d)}</td></tr>`).join('')+`</table><div class="tot r">共缺 ${short.reduce((a,d)=>a+d.box-got(d),0)} 件</div>`}
 if(over.length){h+=`<table style="margin-top:12px"><tr><th>超過（${over.length} 項）</th><th class="n">已搬/單上</th><th class="n">多</th></tr>`+over.map(d=>`<tr><td>${d.name}<br><small style="color:#888">${d.code}</small></td><td class="n">${got(d)}/${d.box}</td><td class="n o">+${got(d)-d.box}</td></tr>`).join('')+`</table>`}
 h+=`<div class="btns"><button class="g" id="cp">複製文字</button><button id="cl">關閉</button></div><div class="hint" style="margin-top:8px">可直接截圖傳 LINE，或按「複製文字」貼上。</div>`;
 $('repc').innerHTML=h;$('rep').hidden=false;
 $('cl').onclick=()=>$('rep').hidden=true;
 $('cp').onclick=()=>{let s=`${O.cust||''} ${O.ord||''} 點貨結果（${ts}）\n`;if(!short.length&&!over.length)s+='全部點齊';
  if(short.length)s+='【缺件】\n'+short.map(d=>`${d.code} ${d.name}：${got(d)}/${d.box}，差${d.box-got(d)}件`).join('\n')+`\n共缺 ${short.reduce((a,d)=>a+d.box-got(d),0)} 件\n`;
  if(over.length)s+='【超過】\n'+over.map(d=>`${d.code} ${d.name}：${got(d)}/${d.box}，多${got(d)-d.box}件`).join('\n');
  const ok=()=>{$('cp').textContent='已複製 ✓'};if(navigator.clipboard)navigator.clipboard.writeText(s).then(ok,()=>prompt('請手動複製',s));else prompt('請手動複製',s)}}
$('rep').onclick=e=>{if(e.target.id==='rep')$('rep').hidden=true};
$('sum').onclick=report;
$('tg').onclick=e=>{document.body.classList.toggle('hide');e.target.classList.toggle('on')};
$('sortb').onclick=e=>{bySeries=!bySeries;e.target.classList.toggle('on');e.target.textContent=bySeries?'依單上順序':'依系列排';render()};
$('rs').onclick=()=>{if(confirm('所有件數歸零？')){st={};save();render()}};
const ta=$('ta');
ta.oninput=()=>{const o=parse(ta.value);const bad=o.items.filter(i=>!i.chk);$('pv').innerHTML=o.items.length?`抓到 ${o.items.length} 項、${o.items.reduce((a,i)=>a+i.box,0)} 件`+(bad.length?`<br><span class="warn">⚠ ${bad.map(i=>i.code).join('、')} 件數×個數≠數量，請核對</span>`:''):'還沒抓到品項'};
$('ex').onclick=()=>{ta.value=SAMPLE;ta.oninput()};
$('nw').onclick=()=>{ta.value='';ta.oninput();$('app').hidden=true;$('inp').hidden=false};
$('back').onclick=()=>{$('inp').hidden=true;$('app').hidden=false};
$('go').onclick=()=>{const o=parse(ta.value);if(!o.items.length){alert('沒抓到品項，請確認貼上的內容有產品編號與數字');return}try{localStorage.setItem('cur',JSON.stringify(o))}catch(e){}load(o)};
let c0=null;try{c0=JSON.parse(localStorage.getItem('cur'))}catch(e){}
load(c0&&c0.items&&c0.items.length?c0:parse(SAMPLE));
</script></body></html>

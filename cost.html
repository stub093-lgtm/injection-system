<!-- ===================== 純計算（無 DOM，可單獨測試） ===================== -->
<script id="cost-core">
const COST = (() => {
    const round1 = (n) => Math.round((Number(n) || 0) * 10) / 10;
    // 加工工序（固定清單，要加新工序就加在這裡）。perBox = 這道工序用「箱」來數
    const PROCESSES = [
        { key: 'trim', label: '剪料頭' },
        { key: 'deburr', label: '修毛邊' },
        { key: 'label', label: '貼條碼' },
        { key: 'bag', label: '裝袋' },
        { key: 'box', label: '裝箱', perBox: true }
    ];
    const processLabel = (k) => (PROCESSES.find(p => p.key === k) || {}).label || k || '（未知工序）';
    const isPerBox = (k) => !!(PROCESSES.find(p => p.key === k) || {}).perBox;

    // 一筆測量做了幾個：用箱數的工序 = 箱數 × 每箱個數
    function piecesOf(r) {
        const n = Number(r.count) || 0;
        return r.perBox ? n * (Number(r.perBox) || 0) : n;
    }
    // 一筆測量的每個秒數
    function secPerPiece(r) {
        const pcs = piecesOf(r), sec = (Number(r.minutes) || 0) * 60;
        return pcs > 0 && sec > 0 ? sec / pcs : null;
    }

    // 由表單輸入檢查並算出要存的內容
    // input: { process, minutes, count, perBox }
    function check(input) {
        const minutes = Number(input.minutes), count = Number(input.count);
        if (!input.process) return { error: '請選擇工序' };
        if (!(minutes > 0)) return { error: '請輸入測量時間（分鐘）' };
        if (!(count > 0)) return { error: isPerBox(input.process) ? '請輸入完成箱數' : '請輸入完成件數' };
        const rec = { process: input.process, minutes, count };
        if (isPerBox(input.process)) {
            const per = Number(input.perBox);
            if (!(per > 0)) return { error: '請輸入每箱幾個' };
            rec.perBox = per;
        }
        return { rec, sec: secPerPiece(rec) };
    }

    // 標準時間：依「產品＋工序」分組，總秒數 ÷ 總件數
    // 回傳 [{ productId, productCode, productName, process, n, sec, lastDate }]
    function standardTimes(records) {
        const g = new Map();
        for (const r of records) {
            const pcs = piecesOf(r), sec = (Number(r.minutes) || 0) * 60;
            if (!(pcs > 0 && sec > 0)) continue;
            const k = `${r.productId}|${r.process}`;
            const x = g.get(k) || { productId: r.productId, productCode: r.productCode, productName: r.productName, process: r.process, n: 0, totalSec: 0, totalPcs: 0, lastDate: '' };
            x.n += 1; x.totalSec += sec; x.totalPcs += pcs;
            if ((r.date || '') > x.lastDate) x.lastDate = r.date || '';
            g.set(k, x);
        }
        return [...g.values()].map(x => ({ productId: x.productId, productCode: x.productCode, productName: x.productName, process: x.process, n: x.n, sec: x.totalSec / x.totalPcs, lastDate: x.lastDate }));
    }

    return { round1, PROCESSES, processLabel, isPerBox, piecesOf, secPerPiece, check, standardTimes };
})();
if (typeof module !== 'undefined') module.exports = COST;
</script>

<!-- ===================== 雲端層 ===================== -->
<script type="module">
const FB_VER = '9.22.1';
// 與 MES（index.html）相同的 Firebase 專案；同一個網站，登入狀態共用
const firebaseConfig = {
    apiKey: "AIzaSyDqFzF8L3N1-gxmycxJc8Y4FFQKXiNN2ds",
    authDomain: "sunghsing.firebaseapp.com",
    databaseURL: "https://sunghsing-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sunghsing",
    storageBucket: "sunghsing.firebasestorage.app",
    messagingSenderId: "12105900713",
    appId: "1:12105900713:web:c747d7d6a82f754b90ffb8",
    measurementId: "G-CQNZHLEVHD"
};
// 工序計時專用的 collection，前綴 cost；產品直接讀 MES 的 products（只讀）
const COL = { timings: 'costTimings' };
const ROLE_LABEL = { admin: '管理者', editor: '技術員', operator: '作業員' };

window.cost = { products: [], timings: [] };
window.currentUser = null;

let fa, fs, auth, db;
let unsubs = [], memberUnsub = null;
const syncMeta = {};
const $ = (id) => document.getElementById(id);
const emailKey = (e) => String(e || '').trim().toLowerCase();

function showScreen(name, text) {
    ['auth-loading', 'auth-login', 'auth-blocked', 'auth-offline'].forEach(id => $(id).classList.add('hidden'));
    if (name === 'app') { $('auth-screen').classList.add('hidden'); return; }
    $('auth-screen').classList.remove('hidden');
    $('auth-' + name).classList.remove('hidden');
    if (text) $('auth-blocked-text').textContent = text;
}

function updateSync() {
    const m = Object.values(syncMeta);
    let t = '● 已同步', c = 'text-emerald-400';
    if (m.some(x => x.hasPendingWrites)) { t = '● 同步中…'; c = 'text-sky-400'; }
    else if (m.some(x => x.fromCache)) { t = '● 離線（連線後自動上傳）'; c = 'text-amber-400'; }
    const el = $('sync-badge'); el.textContent = t; el.className = 'text-[11px] ml-1 ' + c;
}

function errMsg(e) {
    const code = e?.code || '';
    const map = {
        'permission-denied': '權限不足：Firestore 規則尚未開放，或您的角色無法執行此操作',
        'auth/invalid-email': 'Email 格式不正確',
        'auth/user-not-found': '帳號或密碼錯誤',
        'auth/wrong-password': '帳號或密碼錯誤',
        'auth/invalid-credential': '帳號或密碼錯誤',
        'auth/invalid-login-credentials': '帳號或密碼錯誤',
        'auth/too-many-requests': '嘗試次數過多，請稍後再試',
        'auth/network-request-failed': '網路連線失敗'
    };
    return map[code] || `操作失敗（${code || e?.message || '未知錯誤'}）`;
}
function bg(p) { p.catch(e => { console.warn(e); window.toast(errMsg(e)); }); }

let refreshTimer = null;
function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(() => window.renderAll && window.renderAll(), 60); }

function listen(key, ref, onData) {
    unsubs.push(fs.onSnapshot(ref, { includeMetadataChanges: true }, snap => {
        syncMeta[key] = { fromCache: snap.metadata.fromCache, hasPendingWrites: snap.metadata.hasPendingWrites };
        updateSync(); onData(snap); scheduleRefresh();
    }, err => { console.warn(key, err); window.toast(errMsg(err)); }));
}
function stopListeners() { unsubs.forEach(u => u()); unsubs = []; Object.keys(syncMeta).forEach(k => delete syncMeta[k]); }

function startListeners() {
    stopListeners();
    const rows = snap => snap.docs.map(d => ({ ...d.data(), id: d.id }));
    listen('products', fs.collection(db, 'products'), s => {
        window.cost.products = rows(s).sort((a, b) => String(a.code || '').localeCompare(String(b.code || '')));
    });
    listen('timings', fs.collection(db, COL.timings), s => {
        window.cost.timings = rows(s).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
    });
}

const stamp = () => ({ updatedAt: new Date().toISOString(), updatedBy: window.currentUser?.email || '' });
const strip = ({ id, ...rest }) => rest;

window.api = {
    async signIn(email, pw) { await fa.signInWithEmailAndPassword(auth, email.trim(), pw); },
    async logout() { await fa.signOut(auth); },
    newId(col) { return fs.doc(fs.collection(db, COL[col])).id; },
    addTiming(t) {
        bg(fs.setDoc(fs.doc(db, COL.timings, t.id), {
            ...strip(t),
            createdAt: new Date().toISOString(),
            createdBy: window.currentUser.email,
            createdByName: window.currentUser.name || '',
            ...stamp()
        }));
    },
    deleteTiming(id) { bg(fs.deleteDoc(fs.doc(db, COL.timings, id))); }
};

function handleUser(user) {
    if (memberUnsub) { memberUnsub(); memberUnsub = null; }
    stopListeners();
    window.currentUser = null;
    window.cost = { products: [], timings: [] };
    if (!user) { document.body.dataset.role = ''; showScreen('login'); return; }
    if (!user.emailVerified) { showScreen('blocked', `${user.email} 尚未完成 Email 驗證，請到 MES 完成驗證。`); return; }
    const email = emailKey(user.email);
    showScreen('loading');
    memberUnsub = fs.onSnapshot(fs.doc(db, 'members', email), snap => {
        if (!snap.exists()) {
            stopListeners(); window.currentUser = null; document.body.dataset.role = '';
            showScreen('blocked', `${email} 尚未開通。請先到 MES 登入一次送出申請，由管理者核准。`);
            return;
        }
        const m = snap.data();
        const changed = window.currentUser?.role !== m.role;
        window.currentUser = { email, name: m.name || user.displayName || '', role: m.role };
        document.body.dataset.role = m.role;
        $('user-chip').textContent = `${window.currentUser.name || email}（${ROLE_LABEL[m.role] || m.role}）`;
        if (changed) startListeners();
        showScreen('app');
        scheduleRefresh();
    }, err => { console.warn(err); showScreen('blocked', '讀取權限失敗：' + errMsg(err)); });
}

(async () => {
    try {
        const [appMod, authMod, fsMod] = await Promise.all([
            import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`),
            import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-auth.js`),
            import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`)
        ]);
        fa = authMod; fs = fsMod;
        fs.setLogLevel('silent');
        const app = appMod.initializeApp(firebaseConfig);
        auth = fa.getAuth(app);
        auth.languageCode = 'zh-TW';
        db = fs.getFirestore(app);
        // MES 開在另一個分頁時會拿不到離線快取，屬正常，仍可線上使用
        fs.enableIndexedDbPersistence(db).catch(e => console.warn('離線快取未啟用:', e.code));
        fa.onAuthStateChanged(auth, handleUser);
    } catch (e) {
        console.warn('Firebase 載入失敗', e);
        showScreen('offline');
    }
})();
</script>

<!-- ===================== 畫面邏輯 ===================== -->
<script>
const $ = (id) => document.getElementById(id);
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function todayLocal() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const role = () => window.currentUser?.role;
const canEdit = () => role() === 'admin' || role() === 'editor';
const isAdmin = () => role() === 'admin';

window.toast = function (msg) {
    const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
    clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2500);
};

async function authSubmit(e) {
    e.preventDefault();
    try { await api.signIn($('auth-email').value, $('auth-password').value); }
    catch (err) { toast(err.code ? ({ 'auth/invalid-credential': '帳號或密碼錯誤', 'auth/invalid-login-credentials': '帳號或密碼錯誤', 'auth/wrong-password': '帳號或密碼錯誤', 'auth/user-not-found': '帳號或密碼錯誤', 'auth/too-many-requests': '嘗試次數過多，請稍後再試' }[err.code] || err.code) : '登入失敗'); }
}

// ---------- 分頁 ----------
let currentTab = 'std';
function switchTab(tab) {
    currentTab = tab;
    ['std', 'records'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== tab));
    document.querySelectorAll('.tab-btn').forEach(b => {
        const on = b.dataset.tab === tab;
        b.classList.toggle('border-amber-400', on); b.classList.toggle('text-white', on);
        b.classList.toggle('border-transparent', !on); b.classList.toggle('text-slate-400', !on);
    });
}

// ---------- 共用資料 ----------
// 不到 1 秒（例如小盆裝箱）多留一位小數，免得顯示成 0
const fmtSec = (s) => s == null ? '—' : `${(s < 1 ? Math.round(s * 100) / 100 : COST.round1(s)).toLocaleString('zh-TW', { maximumFractionDigits: 2 })} 秒`;
const prodText = (code, name) => [code, name].filter(Boolean).join(' ');
function findProduct(id) { return cost.products.find(p => p.id === id); }
function processOptions(allLabel) {
    return `<option value="">${allLabel}</option>` + COST.PROCESSES.map(p => `<option value="${p.key}">${p.label}</option>`).join('');
}

function renderAll() {
    renderFilters(); renderStd(); renderRecords(); switchTab(currentTab);
}
window.renderAll = renderAll;

function renderFilters() {
    ['std-process', 'rec-process'].forEach(id => {
        const sel = $(id); const cur = sel.value;
        sel.innerHTML = processOptions('全部工序'); sel.value = cur;
    });
}

// ---------- 標準時間 ----------
function renderStd() {
    const q = $('std-search').value.trim().toLowerCase();
    const proc = $('std-process').value;
    const all = COST.standardTimes(cost.timings);
    if (!all.length) {
        $('std-list').innerHTML = `<div class="col-span-full text-center text-slate-500 text-sm py-10">還沒有測量紀錄。按右下角「新增測量」開始記錄。</div>`;
        return;
    }
    // 依產品分組，一張卡片列出這個產品各工序的秒數
    const byProd = new Map();
    all.filter(x => !proc || x.process === proc).forEach(x => {
        const p = findProduct(x.productId);
        const code = p?.code || x.productCode, name = p?.name || x.productName;
        if (q && !prodText(code, name).toLowerCase().includes(q)) return;
        const g = byProd.get(x.productId) || { code, name, items: [] };
        g.items.push(x); byProd.set(x.productId, g);
    });
    const groups = [...byProd.values()].sort((a, b) => String(a.code || '').localeCompare(String(b.code || '')));
    if (!groups.length) { $('std-list').innerHTML = `<div class="col-span-full text-center text-slate-500 text-sm py-10">沒有符合的產品</div>`; return; }
    const order = (k) => COST.PROCESSES.findIndex(p => p.key === k);
    $('std-list').innerHTML = groups.map(g => {
        const items = g.items.sort((a, b) => order(a.process) - order(b.process));
        const total = items.reduce((a, x) => a + x.sec, 0);
        return `<div class="rounded-xl border border-slate-200 bg-white p-4">
            <div class="font-bold text-slate-800">${esc(g.name || '（已刪除的產品）')}</div>
            <div class="text-xs text-slate-500">${esc(g.code)}</div>
            <div class="mt-3 divide-y divide-slate-100">
                ${items.map(x => `<div class="flex items-center justify-between py-1.5 text-sm">
                    <span class="text-slate-700">${esc(COST.processLabel(x.process))}<span class="text-xs text-slate-400 ml-1">測 ${x.n} 次・最近 ${esc(x.lastDate)}</span></span>
                    <b class="text-slate-900">${fmtSec(x.sec)}</b>
                </div>`).join('')}
            </div>
            ${items.length > 1 && !proc ? `<div class="mt-2 pt-2 border-t border-slate-200 flex justify-between text-sm"><span class="text-slate-600">已測工序合計</span><b class="text-blue-700">${fmtSec(total)}</b></div>` : ''}
        </div>`;
    }).join('');
}

// ---------- 測量紀錄 ----------
function renderRecords() {
    const q = $('rec-search').value.trim().toLowerCase();
    const proc = $('rec-process').value, month = $('rec-month').value;
    const list = cost.timings.filter(r => (!proc || r.process === proc) && (!month || (r.date || '').startsWith(month))
        && (!q || `${prodText(r.productCode, r.productName)} ${r.operator || ''}`.toLowerCase().includes(q)));
    $('rec-summary').textContent = `共 ${list.length} 筆`;
    if (!list.length) { $('rec-list').innerHTML = `<div class="text-center text-slate-500 text-sm py-8">沒有紀錄</div>`; return; }
    $('rec-list').innerHTML = list.slice(0, 500).map(r => {
        const qty = r.perBox ? `${r.count} 箱 × ${r.perBox} 個` : `${r.count} 個`;
        const extra = [esc(r.date), r.operator ? esc(r.operator) : '', `${r.minutes} 分鐘做 ${qty}`, r.note ? esc(r.note) : ''].filter(Boolean).join('・');
        return `<div class="px-4 py-3 flex items-start justify-between gap-3">
            <div class="min-w-0">
                <div class="text-sm"><span class="text-[11px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">${esc(COST.processLabel(r.process))}</span>
                    <span class="font-medium text-slate-800 ml-1">${esc(prodText(r.productCode, r.productName))}</span></div>
                <div class="text-xs text-slate-500 mt-1">${extra}</div>
            </div>
            <div class="text-right shrink-0">
                <div class="font-bold text-slate-900">${fmtSec(COST.secPerPiece(r))}<span class="text-xs font-normal text-slate-500">／個</span></div>
                <button onclick="confirmDeleteTiming('${r.id}')" class="need-admin text-[11px] text-slate-400 hover:text-red-600 mt-1">刪除</button>
            </div>
        </div>`;
    }).join('') + (list.length > 500 ? `<div class="text-center text-xs text-slate-400 py-2">只顯示最近 500 筆，請用篩選縮小範圍</div>` : '');
}
let confirmTwice = null;
function confirmDeleteTiming(id) {
    if (!isAdmin()) return;
    if (confirmTwice !== id) { confirmTwice = id; toast('再按一次「刪除」確認'); setTimeout(() => { if (confirmTwice === id) confirmTwice = null; }, 3000); return; }
    confirmTwice = null; api.deleteTiming(id); toast('已刪除');
}

// ---------- 對話框 ----------
function openModal(html) { $('modal-body').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
const inputCls = 'w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500';
const lbl = (t) => `<label class="text-xs font-medium text-slate-600">${t}</label>`;

// ---------- 新增測量 ----------
// 記住上一筆的產品、工序、人員、時間，連續測同一個產品比較快
let lastForm = { productId: '', process: 'trim', operator: '', minutes: 10 };
function openTimingForm() {
    if (!cost.products.length) { toast('讀不到 MES 產品，請確認網路或權限'); return; }
    const operators = [...new Set(cost.timings.map(r => r.operator).filter(Boolean))];
    openModal(`
        <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-lg">新增測量</h3><button onclick="closeModal()" class="text-slate-400 text-xl">&times;</button></div>
        <div class="space-y-3">
            <div>${lbl('產品')}
                <input id="f-prod-q" oninput="renderProdSelect()" placeholder="打料號或品名搜尋" class="${inputCls} mb-1">
                <select id="f-prod" onchange="updateTimingPreview()" class="${inputCls}"></select>
            </div>
            <div>${lbl('工序')}<select id="f-process" onchange="syncProcess()" class="${inputCls}">${COST.PROCESSES.map(p => `<option value="${p.key}">${p.label}</option>`).join('')}</select></div>
            <div class="grid grid-cols-2 gap-2">
                <div>${lbl('日期')}<input type="date" id="f-date" value="${todayLocal()}" class="${inputCls}"></div>
                <div>${lbl('作業人員')}<input id="f-operator" list="f-operator-list" value="${esc(lastForm.operator)}" placeholder="誰做的" class="${inputCls}"><datalist id="f-operator-list">${operators.map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>${lbl('測量時間（分鐘）')}<input type="number" inputmode="decimal" step="any" min="0" id="f-minutes" value="${esc(lastForm.minutes)}" oninput="updateTimingPreview()" class="${inputCls}"></div>
                <div>${lbl('<span id="f-count-label">完成件數</span>')}<input type="number" inputmode="numeric" step="any" min="0" id="f-count" oninput="updateTimingPreview()" class="${inputCls}"></div>
            </div>
            <div id="f-perbox-row" class="hidden">${lbl('每箱幾個')}<input type="number" inputmode="numeric" step="any" min="0" id="f-perbox" oninput="updateTimingPreview()" class="${inputCls}"></div>
            <div>${lbl('備註（選填）')}<input id="f-note" class="${inputCls}" placeholder="例如：毛邊特別多、新手在做"></div>
            <div id="f-preview" class="text-sm rounded-xl bg-slate-50 border border-slate-200 px-3 py-2"></div>
            <button onclick="submitTiming()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl">儲存</button>
        </div>`);
    renderProdSelect();
    if (lastForm.productId && findProduct(lastForm.productId)) $('f-prod').value = lastForm.productId;
    $('f-process').value = lastForm.process;
    syncProcess();
}
function renderProdSelect() {
    const q = $('f-prod-q').value.trim().toLowerCase();
    const cur = $('f-prod').value;
    const list = cost.products.filter(p => !q || prodText(p.code, p.name).toLowerCase().includes(q)).slice(0, 300);
    $('f-prod').innerHTML = list.length ? list.map(p => `<option value="${p.id}">${esc(prodText(p.code, p.name))}</option>`).join('') : `<option value="">找不到符合的產品</option>`;
    if (list.some(p => p.id === cur)) $('f-prod').value = cur;
    updateTimingPreview();
}
function syncProcess() {
    const perBox = COST.isPerBox($('f-process').value);
    $('f-count-label').textContent = perBox ? '完成箱數' : '完成件數';
    $('f-perbox-row').classList.toggle('hidden', !perBox);
    updateTimingPreview();
}
function readTimingInput() {
    return { process: $('f-process').value, minutes: $('f-minutes').value, count: $('f-count').value, perBox: $('f-perbox').value };
}
function updateTimingPreview() {
    const el = $('f-preview'); if (!el) return;
    const r = COST.check(readTimingInput());
    if (r.error) { el.className = 'text-sm rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-slate-500'; el.textContent = '填好時間和件數，這裡會算出每個幾秒'; return; }
    el.className = 'text-sm rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-slate-700';
    el.innerHTML = `每個約 <b>${fmtSec(r.sec)}</b>（共 ${COST.piecesOf(r.rec).toLocaleString('zh-TW')} 個）`;
}
function submitTiming() {
    const p = findProduct($('f-prod').value);
    if (!p) { toast('請選擇產品'); return; }
    const r = COST.check(readTimingInput());
    if (r.error) { toast(r.error); return; }
    const date = $('f-date').value;
    if (!date) { toast('請選擇日期'); return; }
    // 料號、品名存一份當時的快照，產品之後改名或刪除也看得懂
    const t = { id: api.newId('timings'), date, productId: p.id, productCode: p.code || '', productName: p.name || '',
        ...r.rec, operator: $('f-operator').value.trim(), note: $('f-note').value.trim() };
    api.addTiming(t);
    lastForm = { productId: p.id, process: t.process, operator: t.operator, minutes: t.minutes };
    closeModal();
    toast(`已記錄：${COST.processLabel(t.process)} 每個約 ${fmtSec(r.sec)}`);
}

switchTab('std');
</script>
</body>
</html>
